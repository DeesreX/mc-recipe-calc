[project]
name = "mc-recipe-calc"
version = "0.1.0"
description = "Desktop recipe cost calculator for Minecraft-style crafting chains."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mc-recipe-calc = "recipe_calc.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
